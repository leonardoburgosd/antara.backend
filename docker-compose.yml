name: antara

services:
  postgres:
    image: postgres:16
    container_name: antara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-antaradb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: ${TZ:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Solo accesible desde el host (útil para administrar la BD con un cliente)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-antaradb}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - antara-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ./antara.backend
      dockerfile: Dockerfile
    image: antara-api:latest
    container_name: antara-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      AppSettings__ConexionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-antaradb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};SSL Mode=Disable;"
      AppSettings__DefaultAudioStoragePath: /music
      AppSettings__TokenSecret: ${TOKEN_SECRET:-antara-cambia-este-secreto-en-produccion}
      AppSettings__TokenExpiracionHoras: ${TOKEN_EXPIRACION_HORAS:-8}
      AppSettings__EscaneoAudioMaxParalelo: ${ESCANEO_AUDIO_MAX_PARALELO:-4}
      # Tamaño máximo de una canción subida desde el panel (MB).
      AppSettings__SubidaAudioMaxMb: ${SUBUDA_AUDIO_MAX_MB:-2048}
      # Descarga de audio desde YouTube con yt-dlp (incluido en la imagen).
      AppSettings__YtDlpPath: ${YTDLP_PATH:-yt-dlp}
      AppSettings__DescargaYouTubeTimeoutSegundos: ${DESCARGA_YOUTUBE_TIMEOUT_SEGUNDOS:-600}
      # Cliente de YouTube: "android" evita el bloqueo de bots en muchas redes.
      AppSettings__YtDlpPlayerClient: ${YTDLP_PLAYER_CLIENT:-android}
      # Cookies opcionales (formato Netscape) si YouTube exige iniciar sesión.
      AppSettings__YtDlpCookiesPath: ${YTDLP_COOKIES_PATH:-/config/cookies/youtube.txt}
      AppSettings__MetadatosTimeoutSegundos: ${METADATOS_TIMEOUT_SEGUNDOS:-20}
      # Proveedores de metadatos: lista configurable, no clases fijas. Cada índice
      # es un proveedor con su tipo (adaptador), URL, clave y orden de consulta.
      # Para deshabilitar uno: Habilitado=false. Para agregar otro compatible con
      # un adaptador existente: agrega el bloque con el siguiente índice.
      AppSettings__MetadatosProveedores__0__Nombre: deezer
      AppSettings__MetadatosProveedores__0__Etiqueta: Deezer
      AppSettings__MetadatosProveedores__0__Tipo: deezer
      AppSettings__MetadatosProveedores__0__BaseUrl: ${DEEZER_API_BASE:-https://api.deezer.com}
      AppSettings__MetadatosProveedores__0__Prioridad: ${DEEZER_PRIORIDAD:-0}
      AppSettings__MetadatosProveedores__0__Habilitado: ${DEEZER_HABILITADO:-true}
      AppSettings__MetadatosProveedores__1__Nombre: theaudiodb
      AppSettings__MetadatosProveedores__1__Etiqueta: TheAudioDB
      AppSettings__MetadatosProveedores__1__Tipo: theaudiodb
      AppSettings__MetadatosProveedores__1__BaseUrl: ${THEAUDIODB_API_BASE:-https://www.theaudiodb.com/api/v1/json/123}
      AppSettings__MetadatosProveedores__1__ApiKey: ${THEAUDIODB_API_KEY:-123}
      AppSettings__MetadatosProveedores__1__Prioridad: ${THEAUDIODB_PRIORIDAD:-1}
      AppSettings__MetadatosProveedores__1__Habilitado: ${THEAUDIODB_HABILITADO:-true}
      # MusicBrainz + Cover Art Archive: sin clave, limite de 1 peticion/segundo.
      AppSettings__MetadatosProveedores__2__Nombre: musicbrainz
      AppSettings__MetadatosProveedores__2__Etiqueta: MusicBrainz
      AppSettings__MetadatosProveedores__2__Tipo: musicbrainz
      AppSettings__MetadatosProveedores__2__BaseUrl: ${MUSICBRAINZ_API_BASE:-https://musicbrainz.org}
      AppSettings__MetadatosProveedores__2__Prioridad: ${MUSICBRAINZ_PRIORIDAD:-2}
      AppSettings__MetadatosProveedores__2__Habilitado: ${MUSICBRAINZ_HABILITADO:-true}
      # iTunes Search API: sin clave, ~20 peticiones/minuto.
      AppSettings__MetadatosProveedores__3__Nombre: itunes
      AppSettings__MetadatosProveedores__3__Etiqueta: iTunes
      AppSettings__MetadatosProveedores__3__Tipo: itunes
      AppSettings__MetadatosProveedores__3__BaseUrl: ${ITUNES_API_BASE:-https://itunes.apple.com}
      AppSettings__MetadatosProveedores__3__Prioridad: ${ITUNES_PRIORIDAD:-3}
      AppSettings__MetadatosProveedores__3__Habilitado: ${ITUNES_HABILITADO:-true}
      # Alternativa para redefinir TODA la lista desde una sola variable de entorno
      # (JSON). Si se define, tiene prioridad sobre los bloques anteriores.
      METADATOS_PROVEEDORES_JSON: ${METADATOS_PROVEEDORES_JSON:-}
      AppSettings__LetrasProveedor__Tipo: lyricsovh
      AppSettings__LetrasProveedor__BaseUrl: ${LETRAS_API_BASE:-https://api.lyrics.ovh}
      AppSettings__LetrasProveedor__Habilitado: ${LETRAS_HABILITADO:-true}
      AppSettings__HostMountRoot: ${HOST_MOUNT_ROOT:-/host}
      TZ: ${TZ:-UTC}
    volumes:
      # Biblioteca principal (en appsettings.json corresponde a ContainerPath /music)
      - type: bind
        source: ${MUSIC_PATH:-./music}
        target: /music
      # Biblioteca FLAC (en appsettings.json corresponde a ContainerPath /music/flac)
      - type: bind
        source: ${MUSIC_FLAC_PATH:-./music/flac}
        target: /music/flac
      # Unidades del host en solo lectura. No se declaran aquí: las genera
      # scripts/montar-unidades.sh en docker-compose.unidades.yml según las
      # unidades que existan en el host (X:/ -> /host/x). Levanta el stack con
      # ese archivo adicional (ver README) para que las rutas del panel sean
      # visibles desde el contenedor.
      # Portadas y demás archivos subidos desde la API
      - type: volume
        source: uploads_data
        target: /app/wwwroot/uploads
      # Cookies de YouTube para yt-dlp (opcional). El archivo se ignora si no existe.
      - type: bind
        source: ./cookies
        target: /config/cookies
        read_only: true
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Program.cs inicializa la BD antes de host.RunAsync(), por lo que el puerto
      # abierto implica que la API está lista para atender peticiones.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - antara-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  web:
    build:
      context: ./antara.admin
      dockerfile: Dockerfile
    image: antara-admin:latest
    container_name: antara-admin
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/sistema/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - antara-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Acceso remoto por Tailscale. Es opcional: solo se inicia con
  #   docker compose --profile tailscale up -d
  # y requiere TAILSCALE_AUTHKEY en .env. Publica el panel del servicio web en
  # https://<TAILSCALE_HOSTNAME>.<tu-tailnet>.ts.net con "tailscale serve", sin
  # abrir puertos en el router ni reenviar el 80 del host.
  tailscale:
    image: tailscale/tailscale:latest
    container_name: antara-tailscale
    restart: unless-stopped
    profiles: ["tailscale"]
    # El entrypoint arranca containerboot y publica el panel con el nombre DNS
    # real del nodo, sin depender de ${TS_CERT_DOMAIN} ni de HTTPS.
    entrypoint: ["/bin/sh", "/config/entrypoint.sh"]
    environment:
      TS_AUTHKEY: ${TAILSCALE_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME:-antara}
      # http (puerto 80, sin certificados), https (puerto 443, requiere
      # certificados habilitados en el tailnet) o ninguno.
      TAILSCALE_SERVE_MODE: ${TAILSCALE_SERVE_MODE:-http}
      TAILSCALE_SERVE_URL: ${TAILSCALE_SERVE_URL:-http://web:80}
      # Networking en espacio de usuario: no necesita NET_ADMIN ni /dev/net/tun,
      # así funciona igual en Docker Desktop (Windows/macOS) y en Linux.
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_EXTRA_ARGS: ${TAILSCALE_EXTRA_ARGS:-}
      TZ: ${TZ:-UTC}
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./tailscale/entrypoint.sh:/config/entrypoint.sh:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - antara-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    # Reutiliza el volumen creado por el docker-compose anterior para conservar
    # los datos existentes. Si prefieres una BD nueva, cambia el nombre.
    name: antarabackend_postgres_data
  uploads_data:
    name: antara-uploads
  # Conserva la identidad del nodo Tailscale entre reinicios.
  tailscale_state:
    name: antara-tailscale-state

networks:
  antara-network:
    name: antara-network
    driver: bridge
